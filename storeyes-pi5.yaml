include:
  file: storeyes-base.yaml

device:
  layer: rpi5
  # Login account that the SSH key (ssh.pubkey_user1) is installed on.
  user1: m0hcine24
  # Give that user passwordless sudo. Without this the account has no sudo
  # at all (user1sudo defaults to 'none'), root's password is locked and
  # root SSH is disabled - so a broken device can only be recovered by
  # re-flashing. 'nopasswd' also stops the cleanup hook from purging the
  # sudo binary.
  user1sudo: nopasswd
  # Console login. CHANGE THIS. It is in a git repo, so treat it as public.
  # Without it the account is created with --disabled-password, and on a
  # headless image that means the console login prompt cannot be passed at all
  # and the ssh key is the only way in. Setting it does not weaken ssh:
  # ssh.pubkey_only still refuses password auth. It does not weaken sudo either,
  # because user1sudo is set explicitly above and this only changes the default.
  user1pass: Storeyes@2026

image:
  boot_part_size: 256M
  root_part_size: 4G
  name: storeyes-pi5

nm:
  # Must name a file that exists. The network-manager layer guards this path
  # with [ -f ] and skips it without a word, so a wrong name here ships an
  # image with no wifi profile at all and nothing in the build log to say so.
  cmds: ${@SRCROOT}/nm/storeyes-shared.cmds
