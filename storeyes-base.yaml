layer:
  base: storeyes-trixie-base
  network: network-manager
  # Without this the image has no working wifi at all. NetworkManager's default
  # wifi backend is wpa_supplicant, and wpasupplicant is only a Recommends of
  # the network-manager package - the build installs no recommends, so it is
  # absent. iwd is installed and its unit is enabled (it comes in via the
  # storeyes-trixie-base layer), so it owns wlan0 while NM has no supplicant to
  # talk to and parks the device as unavailable. This layer drops
  # /etc/NetworkManager/conf.d/iwd.conf with wifi.backend=iwd and
  # wifi.iwd.autoconnect=false, which points NM at the daemon that is actually
  # running and keeps autoconnect driven by the keyfile profile under nm.cmds.
  wifi: network-manager-iwd
  ssh: openssh-server

ssh:
  pubkey_user1: ${@SRCROOT}/keys/mohcine.pub
  pubkey_only: y

image:
  layer: image-rpios
  compression: zstd

sys:
  # Persist downloaded .deb packages across builds (bind-mounted as
  # /var/cache/apt/archives in the chroot). Dir must exist before building.
  apt_cachedir: ${@SRCROOT}/.apt-cache
